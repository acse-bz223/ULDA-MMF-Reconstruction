[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ulda-mmf"
version = "0.1.0"
description = "Uncertainty-consistent latent domain adaptation for multimode-fiber image reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Bo Zhang"},
  {name = "Donglai An"},
  {name = "Yufei Wang"},
  {name = "Lei Su"},
  {name = "Jiawei Sun"},
  {name = "Pengfei Fan"},
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
rtmnet = ["torch-radon"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
